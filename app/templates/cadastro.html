{% extends "layouts/auth_base.html" %}

{% block titulo %}
Cadastro
{% endblock %}

{% block conteudo %}

<div class="container d-flex justify-content-center align-items-center"
     style="min-height: 100vh;">

    <div class="card shadow p-5"
         style="max-width: 420px; width: 100%; border-radius: 20px;">

        <div class="text-center mb-4">

            <h2 class="fw-bold text-primary">
                🎓 UniManager
            </h2>

            <p class="text-muted">
                Criar uma conta
            </p>

        </div>

        {% if mensagem %}

            <div class="alert alert-info text-center">
                {{ mensagem }}
            </div>

        {% endif %}

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Nome
                </label>

                <input
                    type="text"
                    name="nome"
                    class="form-control"
                    placeholder="Digite seu nome"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Digite seu email"
                    required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Senha
                </label>

                <input
                    type="password"
                    name="senha"
                    class="form-control"
                    placeholder="Digite sua senha"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-success w-100">

                Criar conta

            </button>

        </form>

        <div class="text-center mt-3">

            <a href="{{ url_for('home') }}"
               class="text-decoration-none">

                Já tenho uma conta

            </a>

        </div>

    </div>

</div>

{% endblock %}
