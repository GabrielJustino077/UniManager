
{% extends "layouts/app_base.html" %}

{% block titulo %}
Cadastrar Curso
{% endblock %}

{% block conteudo %}

<div class="container mt-4">

    <h2 class="mb-4">Cadastrar Curso</h2>

    <div class="card shadow-sm p-4">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Nome do curso</label>

                <input
                    type="text"
                    name="nome"
                    class="form-control"
                    placeholder="Ex: Ciência da Computação"
                    maxlength="100"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Duração (períodos)</label>

                <input
                    type="number"
                    name="duracao"
                    class="form-control"
                    min="1"
                    required>
            </div>

            <button type="submit" class="btn btn-success">
                Cadastrar Curso
            </button>

        </form>

    </div>

</div>

{% endblock %}
